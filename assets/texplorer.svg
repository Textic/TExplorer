  <!-- Golden-amber T channel dividing header and dual panes -->
  <path d="M20 108 H236 V116 H138 C134.7 116 132 118.7 132 122 V220 H124 V122 C124 118.7 121.3 116 118 116 H20 Z" fill="url(#goldChannel)"/>
