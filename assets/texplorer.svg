  <!-- Left vertical dark panel -->
  <path d="M20 116 H118 C121.3 116 124 118.7 124 122 V220 H34 C26.3 220 20 213.7 20 206 Z" fill="url(#panelLeft)"/>
  <!-- Right vertical darker panel -->
