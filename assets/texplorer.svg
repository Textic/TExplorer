<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="goldChannel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#E5920A"/>
    </linearGradient>
    <linearGradient id="panelLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#272A31"/>
      <stop offset="100%" stop-color="#1B1D22"/>
    </linearGradient>
    <linearGradient id="panelRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D1F25"/>
      <stop offset="100%" stop-color="#131418"/>
    </linearGradient>
  </defs>
  <!-- Golden rim peeking along top of back folder tab -->
  <path d="M40 44 H94 C101 44 106 48 111 55 L118 65 H216 C224 65 230 71 230 79 V96 H26 V58 C26 50 32 44 40 44 Z" fill="url(#goldRim)"/>
  <!-- Matte dark graphite back folder tab -->
  <path d="M40 48 H93 C99 48 104 51 108 58 L116 68 H216 C224 68 230 74 230 82 V98 H26 V62 C26 54 32 48 40 48 Z" fill="#2A2C32"/>
  <!-- Front folder outer clip & top header strip -->
