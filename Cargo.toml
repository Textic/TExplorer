[workspace]
resolver = "2"
members = [
    "crates/texplorer-core",
    "crates/texplorer-platform",
    "crates/texplorer-vfs",
    "crates/texplorer-net",
    "crates/texplorer-ops",
    "crates/texplorer-mft",
    "crates/texplorer-disk",
    "crates/texplorer-service",
    "crates/texplorer-app",
]
default-members = ["crates/texplorer-app"]

[workspace.package]
version = "0.9.2"
edition = "2024"
authors = ["Textic"]
license = "MIT"

[workspace.dependencies]
base64 = "0.22"
bitflags = { version = "2.6", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
flate2 = "1.0"
futures-channel = "0.3"
futures-util = "0.3"
gpui-kit = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
iroh = "1.5"
md-5 = "0.10"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
    "gzip",
    "brotli",
    "deflate",
] }
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = "0.6"
sha2 = "0.10"
smallvec = "1.15"
suppaftp = { version = "13.0", features = ["native-tls"] }
tar = "0.4"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util", "net"] }
trash = "5.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
windows = "0.58"
windows-sys = "0.59"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

# Optimize dependencies in dev builds so GPUI layout (taffy) and GPU rendering
# run at full frame rate during `cargo run`, while keeping app rebuilds fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Fast, zero-optimization profile used exclusively by CI (`clippy` + `test`)
# so dependencies compile 3-4x faster while local `cargo run` stays smooth.
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
debug = 0

[profile.release]
strip = "symbols"
