[package]
name = "texplorer-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual File System layer for T Explorer (local directories, Home, archives, checksums, hybrid search, background folder sizes)"

[dependencies]
flate2.workspace = true
md-5.workspace = true
rayon.workspace = true
sevenz-rust.workspace = true
sha2.workspace = true
tar.workspace = true
texplorer-core = { path = "../texplorer-core" }
texplorer-mft = { path = "../texplorer-mft" }
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
