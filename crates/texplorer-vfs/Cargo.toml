[package]
name = "texplorer-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual File System layer for T Explorer (local directories, Home, hybrid search, background folder sizes, and fast Win32 enumeration)"

[dependencies]
rayon.workspace = true
texplorer-core = { path = "../texplorer-core" }
texplorer-mft = { path = "../texplorer-mft" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
