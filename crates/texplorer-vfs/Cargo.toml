[package]
name = "texplorer-vfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Virtual File System layer for T Explorer (local directories, Home, archives, and fast Win32 enumeration)"

[dependencies]
texplorer-core = { path = "../texplorer-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }
