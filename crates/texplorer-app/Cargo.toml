[package]
name = "texplorer-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Fast, minimalist flat-dark Windows file explorer built with Rust and GPUI-Kit"
default-run = "texplorer"

[[bin]]
name = "texplorer"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
dirs.workspace = true
futures-channel.workspace = true
futures-util.workspace = true
gpui-kit.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
texplorer-core = { path = "../texplorer-core" }
texplorer-platform = { path = "../texplorer-platform" }
texplorer-vfs = { path = "../texplorer-vfs" }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"
