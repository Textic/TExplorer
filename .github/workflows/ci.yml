name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (windows-x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Exclude build directories from Windows Defender
        shell: pwsh
        run: |
          try {
            $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $cargoHome -ErrorAction SilentlyContinue
          } catch {}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Enable lld-link for faster Windows linking
        shell: pwsh
        run: |
          $lld = (Get-Command lld-link.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $lld -and (Test-Path "C:\Program Files\LLVM\bin\lld-link.exe")) {
            $lld = "C:\Program Files\LLVM\bin\lld-link.exe"
          }
          if ($lld) {
            Write-Host "Using faster linker: $lld"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" >> $env:GITHUB_ENV
          }

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-windows-x86_64-v2
          cache-on-failure: true

      - name: Run strict clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings

      - name: Run workspace test suite
        run: cargo test --workspace --locked --profile ci
