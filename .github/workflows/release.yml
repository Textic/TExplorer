name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Publish Release (windows-x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository with full tag history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve next SemVer tag
        id: ver
        shell: pwsh
        run: |
          $cargoToml = Get-Content -Path "Cargo.toml" -Raw
          if ($cargoToml -notmatch '(?m)^version\s*=\s*"(\d+)\.(\d+)\.(\d+)"') {
            throw "Could not parse workspace version from Cargo.toml"
          }
          $major = [int]$Matches[1]
          $minor = [int]$Matches[2]
          $basePatch = [int]$Matches[3]
          $cargoVersion = "$major.$minor.$basePatch"

          $headTags = @(git tag --points-at HEAD "v*" | Where-Object { $_ -ne "" })
          if ($headTags.Count -gt 0 -and "${{ github.event_name }}" -eq "push") {
            Write-Output "already_tagged=true" >> $env:GITHUB_OUTPUT
            Write-Output "cargo_version=$cargoVersion" >> $env:GITHUB_OUTPUT
            Write-Output "version=$cargoVersion" >> $env:GITHUB_OUTPUT
            Write-Output "tag=$($headTags[0])" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $prefix = "v$major.$minor."
          $existingTags = @(git tag --list "${prefix}*" | Where-Object { $_ -ne "" })
          if ($existingTags.Count -eq 0) {
            $nextPatch = $basePatch
          } else {
            $maxPatch = -1
            foreach ($t in $existingTags) {
              if ($t -match "^v$major\.$minor\.(\d+)$") {
                $p = [int]$Matches[1]
                if ($p -gt $maxPatch) { $maxPatch = $p }
              }
            }
            $nextPatch = [Math]::Max($basePatch, $maxPatch + 1)
          }

          $nextVersion = "$major.$minor.$nextPatch"
          $nextTag = "v$nextVersion"

          Write-Host "Resolved release version: $nextVersion (tag: $nextTag)"
          Write-Output "already_tagged=false" >> $env:GITHUB_OUTPUT
          Write-Output "cargo_version=$cargoVersion" >> $env:GITHUB_OUTPUT
          Write-Output "version=$nextVersion" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$nextTag" >> $env:GITHUB_OUTPUT

      - name: Exclude build directories from Windows Defender
        if: steps.ver.outputs.already_tagged != 'true'
        shell: pwsh
        run: |
          try {
            $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE ".cargo" }
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $cargoHome -ErrorAction SilentlyContinue
          } catch {}

      - name: Install Rust toolchain
        if: steps.ver.outputs.already_tagged != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Enable lld-link for faster Windows linking
        if: steps.ver.outputs.already_tagged != 'true'
        shell: pwsh
        run: |
          $lld = (Get-Command lld-link.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $lld -and (Test-Path "C:\Program Files\LLVM\bin\lld-link.exe")) {
            $lld = "C:\Program Files\LLVM\bin\lld-link.exe"
          }
          if ($lld) {
            Write-Host "Using faster linker: $lld"
            "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$lld" >> $env:GITHUB_ENV
          }

      - name: Restore Cargo cache
        if: steps.ver.outputs.already_tagged != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows-x86_64-v2
          cache-on-failure: true

      - name: Sync build version in runner Cargo.toml
        if: steps.ver.outputs.already_tagged != 'true' && steps.ver.outputs.version != steps.ver.outputs.cargo_version
        shell: pwsh
        run: |
          $raw = Get-Content -Path "Cargo.toml" -Raw
          $updated = $raw -replace '(?m)^(version\s*=\s*")\d+\.\d+\.\d+(")', "`${1}${{ steps.ver.outputs.version }}`${2}"
          Set-Content -Path "Cargo.toml" -Value $updated -NoNewline

      - name: Build release binaries, test & package Windows installer
        if: steps.ver.outputs.already_tagged != 'true'
        shell: pwsh
        run: |
          $lockFlag = if ("${{ steps.ver.outputs.version }}" -eq "${{ steps.ver.outputs.cargo_version }}") { "--locked" } else { $null }
          $buildArgs = @("build", "--release", "-p", "texplorer-app", "-p", "texplorer-service")
          $testArgs = @("test", "--workspace", "--release")
          if ($lockFlag) {
            $buildArgs += $lockFlag
            $testArgs += $lockFlag
          }
          & cargo @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo @testArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\packaging\windows\build-setup.ps1 `
            -BinaryPath "target\release\texplorer.exe" `
            -ServiceBinaryPath "target\release\texplorer-service.exe" `
            -Version "${{ steps.ver.outputs.version }}" `
            -Tag "${{ steps.ver.outputs.tag }}" `
            -OutDir "dist"

      - name: Generate SHA-256 checksums and publish GitHub Release
        if: steps.ver.outputs.already_tagged != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $distDir = (Resolve-Path "dist").Path
          $files = Get-ChildItem -Path $distDir -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $distDir "SHA256SUMS.txt"), ($lines -join "`n") + "`n", $utf8NoBom)

          $tag = "${{ steps.ver.outputs.tag }}"
          $assets = Get-ChildItem -Path $distDir -File | Select-Object -ExpandProperty FullName
          gh release create "$tag" `
            --target "${{ github.sha }}" `
            --title "TExplorer $tag" `
            --generate-notes `
            @assets
